<section class="section container featured" id="destacados">
  <div class="featured-heading">
    <p class="eyebrow">03 / LA SELECCIÓN</p>
    <h2>
      Buen hardware.
      <br>
      <em>Sin ruido.</em>
    </h2>
    <div class="featured-note">
      <p>
        Lo que importa: cómo responde,
        <br>
        cómo se siente, cómo encaja.
      </p>
      <a href="#tienda" class="text-link">Catálogo completo ↗</a>
    </div>
  </div>
  <div class="selection-toolbar">
    <div class="tabs" role="tablist" aria-label="Selección de productos">
      <button role="tab" aria-selected="true" data-tab="Destacados" id="featured-tab-0" aria-controls="featured-grid" tabindex="0">Selección</button>
      <button role="tab" aria-selected="false" data-tab="Nuevos" id="featured-tab-1" aria-controls="featured-grid" tabindex="-1">Lo nuevo</button>
      <button role="tab" aria-selected="false" data-tab="Más vendidos" id="featured-tab-2" aria-controls="featured-grid" tabindex="-1">Los favoritos</button>
      <button role="tab" aria-selected="false" data-tab="Ofertas" id="featured-tab-3" aria-controls="featured-grid" tabindex="-1">Precio especial</button>
    </div>
    <span>HARDWARE INDEX / 2026</span>
  </div>
  <div class="product-grid" id="featured-grid" role="tabpanel" aria-labelledby="featured-tab-0" tabindex="0">{{featuredProducts}}</div>
  <div class="section-footnote">
    <span>PRODUCTOS Y PRECIOS DE DEMOSTRACIÓN.</span>
    <span>IMÁGENES DE REFERENCIA / FOTOGRAFÍA REAL.</span>
  </div>
</section>
